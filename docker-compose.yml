version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sa-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: samruddhi_agros
      POSTGRES_USER: sa_user
      POSTGRES_PASSWORD: sa_dev_password
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sa_user -d samruddhi_agros']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sa-redis
    ports:
      - '6379:6379'
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
